  <body>
    <!-- FOUC 防闪：在 React mount 之前同步 apply 主题 class，避免初次 paint 后突变 -->
    <script>
      (function () {
        try {
          var KEY = 'image2pdf_theme_v2';
          var saved = localStorage.getItem(KEY);
          var preferDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark' ? saved : (preferDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          // 跨 tab 同步
          window.addEventListener('storage', function (e) {
            if (e.key === KEY) {
              if (e.newValue === 'dark') document.documentElement.classList.add('dark');
              else document.documentElement.classList.remove('dark');
            }
          });
        } catch (e) {}
      })();
    </script>
